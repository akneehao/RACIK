<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Racik — Perencana Menu MBG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F3E8; --paper-dim:#EFE9D8; --ink:#1F2B22; --ink-soft:#4A5A4C;
    --leaf:#3F6B4F; --leaf-dark:#2C4C38; --gold:#E8A33D; --gold-soft:#F3D9A8;
    --chili:#C0392B; --chili-soft:#F6DCD8; --card:#FFFFFF; --line:#DCD4BC;
    --ok:#3F6B4F; --warn:#B9761E;
    --radius:14px;
    --shadow:0 2px 0 rgba(31,43,34,.06), 0 12px 24px -16px rgba(31,43,34,.25);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:'Space Grotesk',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  h1,h2,h3,h4{font-family:'Fraunces',Georgia,serif;font-weight:600;letter-spacing:-.01em;margin:0}
  .mono,.num{font-family:'JetBrains Mono',ui-monospace,monospace}
  button{font-family:inherit}
  a{color:var(--leaf)}
  :focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:18px 24px;max-width:1240px;margin:0 auto;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:11px}
  .brand-mark{width:36px;height:36px;border-radius:10px;
    background:linear-gradient(155deg,var(--leaf),var(--leaf-dark));display:grid;place-items:center;
    color:var(--gold-soft);font-family:'Fraunces',serif;font-weight:700;font-size:18px;
    box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
  .brand-name{font-family:'Fraunces',serif;font-weight:700;font-size:22px}
  .brand-sub{font-size:12.5px;color:var(--ink-soft)}
  .badge{font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:100px;
    background:var(--paper-dim);color:var(--ink-soft);border:1px solid var(--line)}

  .app{max-width:1240px;margin:0 auto;padding:0 24px 90px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow)}
  .pad{padding:20px}

  /* ---------- setup ---------- */
  .setup{display:grid;grid-template-columns:1.35fr .9fr;gap:20px;align-items:start}
  @media (max-width:900px){.setup{grid-template-columns:1fr}}
  .hero h1{font-size:clamp(30px,4.4vw,44px);line-height:1.06;margin-bottom:10px}
  .hero h1 em{font-style:normal;color:var(--leaf)}
  .hero p{color:var(--ink-soft);font-size:15px;line-height:1.6;margin:0 0 20px;max-width:56ch}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:560px){.grid2{grid-template-columns:1fr}}
  label.fld{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);
    margin-bottom:6px;letter-spacing:.01em}
  input,select{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;
    background:var(--card);font-family:inherit;font-size:14.5px;color:var(--ink)}
  input:focus,select:focus{border-color:var(--leaf)}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
  .chip{font-size:12.5px;padding:6px 12px;border-radius:100px;border:1.5px solid var(--line);
    background:var(--card);cursor:pointer;color:var(--ink-soft)}
  .chip[aria-pressed="true"]{background:var(--leaf);border-color:var(--leaf);color:#fff;font-weight:600}
  .btn{border:none;border-radius:11px;padding:13px 22px;font-weight:700;font-size:15px;cursor:pointer;
    background:var(--leaf);color:#fff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.14)}
  .btn:hover{background:var(--leaf-dark)}
  .btn[disabled]{opacity:.55;cursor:progress}
  .btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line);box-shadow:none;
    padding:9px 15px;font-size:13.5px;font-weight:600}
  .btn.ghost:hover{background:var(--paper-dim)}
  .hint{font-size:12px;color:var(--ink-soft);margin-top:7px;line-height:1.5}

  /* ---------- summary ---------- */
  .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0}
  .metric{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .metric .k{font-size:11.5px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;
    letter-spacing:.05em}
  .metric .v{font-family:'JetBrains Mono',monospace;font-size:23px;font-weight:700;margin-top:5px}
  .metric .s{font-size:12px;color:var(--ink-soft);margin-top:2px}
  .bar{height:8px;border-radius:100px;background:var(--paper-dim);overflow:hidden;margin-top:9px}
  .bar > i{display:block;height:100%;background:var(--leaf);border-radius:100px}
  .bar.over > i{background:var(--chili)}

  /* ---------- week ---------- */
  .tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 14px}
  .tab{flex-shrink:0;border:1.5px solid var(--line);background:var(--card);border-radius:11px;
    padding:9px 15px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--ink-soft);
    display:flex;align-items:center;gap:9px}
  .tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
  .tab .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
  .tab .dot.warn{background:var(--gold)}
  .tab .dot.bad{background:var(--chili)}

  .tray{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px}
  .slot{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px;
    display:flex;flex-direction:column;gap:9px;cursor:pointer;text-align:left;font-family:inherit}
  .slot:hover{border-color:var(--leaf)}
  .slot .cat{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
    color:var(--leaf);display:flex;align-items:center;gap:6px}
  .slot h4{font-size:15.5px;line-height:1.28}
  .slot .meta{font-size:12px;color:var(--ink-soft);display:flex;justify-content:space-between;gap:8px;
    margin-top:auto;padding-top:8px;border-top:1px dashed var(--line)}
  .qbadge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:100px;letter-spacing:.04em}
  .qbadge.high{background:#E4EFE7;color:var(--leaf-dark)}
  .qbadge.medium{background:var(--gold-soft);color:#7A5510}
  .qbadge.low{background:var(--chili-soft);color:#8A2317}

  /* ---------- tables ---------- */
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--ink-soft);padding:9px 10px;border-bottom:1.5px solid var(--line)}
  td{padding:9px 10px;border-bottom:1px solid var(--paper-dim);vertical-align:top}
  td.num,th.num{text-align:right;font-family:'JetBrains Mono',monospace}
  .scroll{overflow-x:auto}
  tr.dim td{color:var(--ink-soft)}

  .nut{display:grid;grid-template-columns:118px 1fr 108px;gap:11px;align-items:center;
    padding:7px 0;border-bottom:1px solid var(--paper-dim);font-size:13px}
  .nut .lbl{display:flex;align-items:center;gap:6px}
  .nut .track{height:9px;background:var(--paper-dim);border-radius:100px;overflow:hidden}
  .nut .track > i{display:block;height:100%;background:var(--leaf)}
  .nut .track > i.short{background:var(--gold)}
  .nut .track > i.bad{background:var(--chili)}

  /* ---------- nav ---------- */
  .result-nav{display:flex;gap:6px;margin:22px 0 18px;border-bottom:1.5px solid var(--line)}
  .result-nav-btn{border:none;background:none;padding:11px 16px;font-size:14px;font-weight:700;
    color:var(--ink-soft);cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-1.5px;
    font-family:inherit}
  .result-nav-btn.active{color:var(--leaf-dark);border-bottom-color:var(--leaf)}
  .result-nav-btn:hover{color:var(--ink)}

  /* ---------- vertical nutrition chart ---------- */
  .chart-vert{display:flex;align-items:flex-end;gap:14px;height:180px;padding:8px 4px 0;
    overflow-x:auto}
  .chart-col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
    height:100%;min-width:52px;flex-shrink:0}
  .chart-col .bar-wrap{flex:1;display:flex;align-items:flex-end;width:26px}
  .chart-col .bar{width:100%;border-radius:5px 5px 2px 2px;background:var(--leaf);
    min-height:3px;transition:height .25s ease}
  .chart-col .bar.short{background:var(--gold)}
  .chart-col .bar.bad{background:var(--chili)}
  .chart-col .pct{font-size:11px;font-weight:700;font-family:'JetBrains Mono',monospace;
    margin-bottom:4px;color:var(--ink-soft)}
  .chart-col .lbl{font-size:10.5px;color:var(--ink-soft);margin-top:8px;text-align:center;
    line-height:1.25;max-width:60px}
  .chart-col .lbl .advisory{display:block;margin:2px auto 0}

  /* ---------- day review ---------- */
  .review-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .review-btns{display:flex;gap:8px}
  .review-btn{border:1.5px solid var(--line);background:var(--card);border-radius:9px;
    width:38px;height:38px;font-size:16px;cursor:pointer;color:var(--ink-soft)}
  .review-btn.accept.active{background:var(--leaf);border-color:var(--leaf);color:#fff}
  .review-btn.reject.active{background:var(--chili);border-color:var(--chili);color:#fff}
  .reason-chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
  .reason-chip{font-size:12.5px;padding:7px 13px;border-radius:100px;border:1.5px solid var(--line);
    background:var(--card);cursor:pointer;color:var(--ink-soft);font-family:inherit}
  .reason-chip:hover{border-color:var(--chili)}
  .reason-chip.picked{background:var(--chili);border-color:var(--chili);color:#fff}
  .nut .val{text-align:right;font-family:'JetBrains Mono',monospace;font-size:12px}
  .advisory{font-size:9.5px;font-weight:700;color:var(--warn);border:1px solid var(--gold-soft);
    background:#FFF8EA;padding:1px 5px;border-radius:5px;letter-spacing:.03em}

  .notice{background:#FFF8EA;border:1px solid var(--gold-soft);border-radius:11px;padding:13px 15px;
    font-size:13px;line-height:1.6;color:#6B4E14}
  .notice ul{margin:8px 0 0;padding-left:19px}
  .notice li{margin-bottom:6px}
  .section-head{display:flex;align-items:baseline;justify-content:space-between;gap:14px;
    margin:30px 0 13px;flex-wrap:wrap}
  .section-head h2{font-size:21px}
  .section-head p{margin:3px 0 0;font-size:13px;color:var(--ink-soft)}

  dialog{border:none;border-radius:16px;padding:0;max-width:720px;width:calc(100% - 32px);
    box-shadow:0 30px 70px -20px rgba(31,43,34,.5);background:var(--card);color:var(--ink)}
  dialog::backdrop{background:rgba(31,43,34,.45)}
  .dlg-head{padding:20px 22px 14px;border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
  .dlg-body{padding:18px 22px 24px;max-height:66vh;overflow-y:auto}
  .x{border:none;background:var(--paper-dim);width:32px;height:32px;border-radius:9px;cursor:pointer;
    font-size:17px;line-height:1;color:var(--ink-soft);flex-shrink:0}
  .steps{padding-left:19px;margin:8px 0 0;font-size:13.5px;line-height:1.65;color:var(--ink-soft)}
  .steps li{margin-bottom:5px}

  .empty{text-align:center;padding:44px 20px;color:var(--ink-soft);font-size:14px}
  .spinner{width:17px;height:17px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;
    border-radius:50%;display:inline-block;vertical-align:-3px;margin-right:8px;
    animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .hidden{display:none!important}

  .lang{display:flex;gap:2px;background:var(--paper-dim);border-radius:100px;padding:3px;
    border:1px solid var(--line)}
  .lang button{border:none;background:transparent;padding:5px 12px;border-radius:100px;
    cursor:pointer;color:var(--ink-soft);font-size:12px;font-weight:700;letter-spacing:.04em}
  .lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="brand-mark">R</div>
    <div>
      <div class="brand-name">Racik</div>
      <div class="brand-sub" data-i18n="brand.sub"></div>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="id">ID</button>
      <button type="button" data-lang="en">EN</button>
    </div>
    <div class="badge mono" id="corpusBadge">…</div>
  </div>
</header>

<main class="app">

  <!-- ============ SETUP ============ -->
  <section id="setup">
    <div class="setup">
      <div class="hero">
        <h1 data-i18n-html="hero.title"></h1>
        <p data-i18n="hero.lede"></p>

        <div class="card pad">
          <div class="grid2">
            <div>
              <label class="fld" for="stage" data-i18n="f.stage"></label>
              <select id="stage"></select>
            </div>
            <div>
              <label class="fld" for="days" data-i18n="f.days"></label>
              <select id="days"></select>
            </div>
            <div>
              <label class="fld" for="portions" data-i18n="f.portions"></label>
              <input type="number" id="portions" value="120" min="1" max="100000">
            </div>
            <div>
              <label class="fld" for="province" data-i18n="f.province"></label>
              <select id="province"></select>
            </div>
            <div>
              <label class="fld" for="budget" data-i18n="f.budget"></label>
              <input type="number" id="budget" value="10000" min="1000" step="500">
            </div>
            <div>
              <label class="fld" for="share" data-i18n="f.share"></label>
              <select id="share"></select>
            </div>
          </div>

          <div style="margin-top:14px">
            <label class="fld" for="exclude" data-i18n="f.exclude"></label>
            <input type="text" id="exclude" data-i18n-ph="f.excludePh">
            <div class="chips" id="allergyChips"></div>
          </div>

          <div id="pantryBox" class="hidden" style="margin-top:14px">
            <label class="fld" data-i18n="f.pantry"></label>
            <p class="hint" style="margin-top:0" data-i18n="f.pantryHint"></p>
            <div id="pantryList" style="display:flex;flex-direction:column;gap:7px"></div>
          </div>

          <div style="margin-top:18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap">
            <button class="btn" id="go" data-i18n="btn.go"></button>
            <span class="hint" style="margin:0" data-i18n="hint.go"></span>
          </div>
        </div>
      </div>

      <aside>
        <div class="card pad" style="margin-bottom:20px">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">
            <h3 style="font-size:17px" data-i18n="ask.title"></h3>
            <span class="badge mono" id="orchBadge" style="font-size:10.5px">…</span>
          </div>
          <p style="font-size:12.5px;color:var(--ink-soft);margin:6px 0 11px;line-height:1.55"
             data-i18n="ask.desc"></p>
          <textarea id="askBox" rows="3" data-i18n-ph="ask.ph"
            style="width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;
                   font-family:inherit;font-size:14px;resize:vertical;color:var(--ink);background:var(--card)"></textarea>
          <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
            <button class="btn" id="askBtn" style="padding:10px 18px;font-size:14px" data-i18n="btn.ask"></button>
            <button class="btn ghost" id="askExample" data-i18n="btn.example"></button>
          </div>
          <div id="askOut" class="hidden" style="margin-top:14px"></div>
        </div>

        <div class="card pad">
          <h3 style="font-size:17px" data-i18n="basis.title"></h3>
          <div id="stageTargets" style="margin-top:12px"></div>
          <div class="notice" style="margin-top:16px">
            <strong data-i18n="basis.headline"></strong>
            <ul style="padding-left:17px;margin:7px 0 0">
              <li data-i18n="basis.li1"></li>
              <li data-i18n="basis.li2"></li>
              <li data-i18n="basis.li3"></li>
            </ul>
          </div>
        </div>

        <div id="recipeBox" class="card pad hidden" style="margin-top:20px">
          <h3 style="font-size:17px" data-i18n="recipe.myTitle"></h3>
          <p class="hint" style="margin-top:0" data-i18n="recipe.myHint"></p>
          <div id="recipeList" style="display:flex;flex-direction:column;gap:7px;margin-top:10px"></div>
        </div>
      </aside>
    </div>
  </section>

  <!-- ============ RESULT ============ -->
  <section id="result" class="hidden">
    <div class="section-head">
      <div>
        <h2 id="planTitle"></h2>
        <p id="planSub"></p>
      </div>
      <div style="display:flex;gap:9px;flex-wrap:wrap">
        <button class="btn ghost" id="backBtn" data-i18n="btn.back"></button>
        <button class="btn ghost" id="reshuffleBtn" data-i18n="btn.reshuffle"></button>
        <button class="btn ghost" id="csvBtn" data-i18n="btn.csv"></button>
        <button class="btn ghost" id="reportBtn" data-i18n="btn.report"></button>
      </div>
    </div>

    <div class="notice hidden" id="planLoading" style="margin-bottom:14px;display:flex;align-items:center;gap:8px">
      <span class="spinner" style="border-top-color:var(--warn);border-color:rgba(185,118,30,.3)"></span>
      <span data-i18n="loading.recalc"></span>
    </div>
    <div class="card pad hidden" id="agentPanel" style="margin-bottom:18px"></div>

    <div class="metrics" id="metrics"></div>
    <div id="notes"></div>

    <nav class="result-nav" id="resultNav" role="tablist">
      <button type="button" class="result-nav-btn active" data-view="plan"
        role="tab" aria-selected="true" data-i18n="nav.plan"></button>
      <button type="button" class="result-nav-btn" data-view="procurement"
        role="tab" aria-selected="false" data-i18n="nav.procurement"></button>
    </nav>

    <div id="viewPlan">
      <div class="tabs" id="dayTabs" role="tablist"></div>

      <div class="section-head"><div><h2 data-i18n="sec.compliance"></h2>
        <p id="complianceSub"></p></div></div>
      <div class="card pad" id="complianceChart"></div>

      <div class="card pad" id="dayReview" style="margin:14px 0"></div>

      <div class="section-head"><div><h2 data-i18n="sec.tray"></h2>
        <p data-i18n="sec.traySub"></p></div></div>
      <div class="tray" id="tray"></div>
    </div>

    <div id="viewProcurement" class="hidden">
      <div class="section-head"><div><h2 data-i18n="sec.proc"></h2>
        <p id="procSub"></p></div></div>
      <div class="card pad scroll" id="procurement"></div>
    </div>
  </section>
</main>

<dialog id="dlg">
  <div class="dlg-head">
    <div>
      <div class="mono" style="font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
        color:var(--leaf);font-weight:700" id="dlgSlot"></div>
      <h3 id="dlgTitle" style="font-size:20px;margin-top:5px"></h3>
      <div style="font-size:12.5px;color:var(--ink-soft);margin-top:4px" id="dlgMeta"></div>
    </div>
    <button class="x" id="dlgClose" data-i18n-aria="a11y.close">×</button>
  </div>
  <div class="dlg-body" id="dlgBody"></div>
</dialog>

<script>
"use strict";

/* ============================================================
   Language. DEFAULT_LANG is the one line the packaging script
   rewrites to produce the Indonesian and English builds; the
   toggle and localStorage still let a user switch either way.
   ============================================================ */
const DEFAULT_LANG = "id";   /* BUILD:DEFAULT_LANG */

const STRINGS = {
  id: {
    "page.title": "Racik — Perencana Menu MBG",
    "brand.sub": "Perencana menu MBG · AKG 2019 · TKPI 2020",
    "hero.title": "Menu bergizi,<br><em>dihitung</em> bukan ditebak.",
    "hero.lede": "Racik menyusun menu Makan Bergizi Gratis dari korpus resep daerah, menghitung gizinya dengan Tabel Komposisi Pangan Indonesia, lalu memilih kombinasi terbaik di bawah pagu anggaran dengan pemrograman bilangan bulat (CP-SAT).",
    "f.stage": "Jenjang penerima",
    "f.days": "Jumlah hari",
    "f.portions": "Jumlah porsi / hari",
    "f.province": "Preferensi daerah",
    "f.budget": "Pagu per porsi (Rp)",
    "f.share": "Porsi anggaran bahan baku",
    "f.exclude": "Alergi / pantangan (pisahkan dengan koma)",
    "f.excludePh": "mis. udang, kacang tanah, telur",
    "f.pantry": "Stok sisa minggu lalu",

let LANG = (() => {
  try {
    const saved = localStorage.getItem("racik.lang");
    if (saved && STRINGS[saved]) return saved;
  } catch (e) { /* storage unavailable */ }
  return STRINGS[DEFAULT_LANG] ? DEFAULT_LANG : "id";
})();

const t = (key, vars) => {
  let s = (STRINGS[LANG] && STRINGS[LANG][key]) || STRINGS[DEFAULT_LANG][key] || key;
  if (vars) for (const k in vars) s = s.split("{" + k + "}").join(vars[k]);
  return s;
};
const locale = () => (LANG === "id" ? "id-ID" : "en-US");
const num = n => Number(n).toLocaleString(locale());

const API = "";
const rp = n => "Rp" + num(Math.round(n));
const el = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function applyI18n(){
  document.documentElement.lang = LANG;
  document.title = t("page.title");
  document.querySelectorAll("[data-i18n]").forEach(n =>
    n.textContent = t(n.dataset.i18n));
  document.querySelectorAll("[data-i18n-html]").forEach(n =>

function setLang(next){
  if(!STRINGS[next] || next === LANG) return;
  LANG = next;

/** What's on record from a previous week's "sisa?" report (Procurement
 * tab) — shown before generating so nobody has to re-type what they
 * already told the system. Feeds PlanRequest.pantry_items (optimizer's
 * pantry bonus) via whichever rows stay checked. */
async function loadPantry(){
  const box = el("pantryBox"), list = el("pantryList");
  try{
    const res = await fetch(API + `/api/pantry?province=${encodeURIComponent(el("province").value)}&stage=${el("stage").value}`);
    const data = await res.json();
    if(!data.items || !data.items.length){ box.classList.add("hidden"); list.innerHTML = ""; return; }
    box.classList.remove("hidden");
    list.innerHTML = data.items.map((it, i) => `
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--paper-dim);
        border-radius:8px;padding:8px 10px;font-size:13px">
        <input type="checkbox" class="pantry-check" id="pantry-${i}" data-code="${esc(it.tkpi_code)}" checked>
        <label for="pantry-${i}" style="flex:1;min-width:120px">${esc(it.ingredient_name)}
          <span class="mono" style="color:var(--ink-soft);font-size:11.5px">${(it.remaining_g/1000).toFixed(2)} kg</span></label>
        <span style="font-size:11.5px;color:var(--ink-soft)">${esc(t("f.pantryDays"))}</span>
        <input type="number" class="pantry-days" min="1" max="14"
          value="${it.usable_within_days || 3}" style="width:56px;padding:5px 7px;font-size:12.5px">
        <button type="button" class="pantry-remove" data-code="${esc(it.tkpi_code)}"
          title="${esc(t("f.pantryRemove"))}"
          style="border:none;background:transparent;color:var(--ink-soft);cursor:pointer;
                 font-size:15px;line-height:1;padding:2px 4px">×</button>
      </div>`).join("");
    // Unchecking only excludes an item from *this* plan (see collectPantryItems);
    // removing it here is the lasting action — it won't reappear on reload,
    // unlike an unchecked-but-still-stored row would.
    list.querySelectorAll(".pantry-remove").forEach(btn =>
      btn.onclick = async () => {
        btn.disabled = true;
        try{
          await fetch(API + `/api/pantry/clear?province=${encodeURIComponent(el("province").value)}` +
            `&stage=${el("stage").value}&tkpi_code=${encodeURIComponent(btn.dataset.code)}`,
            { method: "POST" });
          loadPantry();
        }catch(err){ btn.disabled = false; }
      });
  }catch(err){ box.classList.add("hidden"); }
}

/** The confirmed subset — unchecked rows (spoiled, already gone) are left
 * out, same as the design we walked through: storage isn't trusted
 * blindly, the kitchen's confirmation at generate-time is. */
function collectPantryItems(){
  return [...el("pantryList").querySelectorAll(".pantry-check:checked")].map(cb => {
    const row = cb.closest("div");
    return {
      tkpi_code: cb.dataset.code,
      usable_within_days: +row.querySelector(".pantry-days").value || 3
    };
  });
}

function collectBody(){
  const terms = el("exclude").value.split(",").map(x => x.trim()).filter(Boolean);

    ingredient_budget_share: +el("share").value,
    exclude_terms: [...new Set(terms)],

    pantry_items: collectPantryItems()

/** Turn the form into one real natural-language request, so the primary
 * "Build menu" button is a genuine agent call — not a shortcut around it —
 * the same /api/ask path "Tanya Racik" uses, parsed by the same orchestrator. */
function buildAskSentence(body){
  const stageObj = (META.stages || []).find(s => s.key === body.stage);
  const stageLabel = stageObj ? stageObj.label : body.stage;
  if(LANG === "id"){
    let s = `Buatkan menu ${body.days} hari untuk ${stageLabel}` +
      (body.province ? ` di ${body.province}` : "") +
      `, ${body.portions} porsi, pagu Rp${body.budget_per_portion_idr}.`;
    if(body.exclude_terms.length) s += ` Hindari ${body.exclude_terms.join(", ")}.`;
    return s;
  }
  let s = `Plan a ${body.days}-day menu for ${stageLabel}` +
    (body.province ? ` in ${body.province}` : "") +
    `, ${body.portions} portions, budget Rp${body.budget_per_portion_idr}.`;
  if(body.exclude_terms.length) s += ` Avoid ${body.exclude_terms.join(", ")}.`;
  return s;
}

/** The backend's `stopped_because` values are internal engineering states
 * ("sea-lion unavailable", "hit step cap (6)") — meaningful for debugging,
 * meaningless (and alarming — sounds like an outage) to a kitchen operator.
 * Translate the ones we know; anything unrecognised passes through rather
 * than hiding a genuinely new failure mode. */
function friendlyReason(reason){
  if(reason === "completed") return t("reason.completed");
  if(reason === "sea-lion unavailable") return t("reason.basicMode");
  if(/^hit step cap/.test(reason || "")) return t("reason.stepCap");
  return reason;
}

function renderAgentPanel(askData){
  const panel = el("agentPanel");
  if(!askData){ panel.classList.add("hidden"); return; }
  // The technical reason (expired credentials, network) lives in a
  // tooltip, not the answer body — a raw AWS error as the first thing an
  // operator reads is alarming and means nothing to them; the badge text
  // itself already says, in plain language, that a rule-based planner
  // answered instead.
  const modeTag = askData.mode === "sealion"
    ? `<span class="qbadge high">${esc(askData.model.split("/").pop())}</span>`
    : `<span class="qbadge medium"${askData.fallback_reason ? ` title="${esc(askData.fallback_reason)}"` : ""}>${esc(t("orch.basic"))}</span>`;
  const tools = askData.trace.length
    ? `<details style="margin-top:10px">
         <summary style="cursor:pointer;font-size:12.5px;color:var(--ink-soft);font-weight:600">
           ${esc(t("ask.trace", {n: askData.trace.length}))}</summary>
         <div style="margin-top:8px">${askData.trace.map(x => `
           <div style="border-left:2.5px solid var(--line);padding:5px 0 5px 10px;margin-bottom:7px">
             <div class="mono" style="font-size:11.5px;font-weight:700">${esc(x.tool)}
               <span style="font-weight:400;color:var(--ink-soft)">${x.seconds}s</span></div>
             <div class="mono" style="font-size:10.5px;color:var(--ink-soft);word-break:break-all">
               ${esc(JSON.stringify(x.arguments))}</div>
           </div>`).join("")}</div>
       </details>` : "";
  panel.classList.remove("hidden");
  panel.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">
      <h3 style="font-size:15.5px">${esc(t("agent.title"))}</h3>
      <div style="display:flex;align-items:center;gap:8px">${modeTag}
        <span style="font-size:11.5px;color:var(--ink-soft)">${esc(t("ask.steps", {n: askData.steps, reason: friendlyReason(askData.stopped_because)}))}</span></div>
    </div>
    <div style="font-size:13px;line-height:1.6;color:var(--ink-soft);white-space:pre-wrap;margin-top:8px">
      ${esc(askData.answer)}</div>
    ${tools}`;
}

async function generate(seed, triggerBtn){
  // Whichever button was actually clicked needs its own feedback — a solve
  // takes ~12-25s (agent call, then the real solve), and when reshuffle is
  // clicked #result is already showing and #go is off-screen, so spinning
  // #go alone is invisible: the page looks frozen for the entire wait.
  const btn = triggerBtn || el("go");
  const otherBtn = btn === el("go") ? el("reshuffleBtn") : el("go");
  const original = btn.textContent;
  const body = LAST_BODY = collectBody();
  if(seed !== undefined) body.random_seed = seed;
  btn.disabled = true;
  if(otherBtn) otherBtn.disabled = true;
  btn.innerHTML = `<span class="spinner"></span>${esc(t("btn.going"))}`;
  const loading = el("planLoading");
  if(loading) loading.classList.remove("hidden");
  try{
    // Primary path goes through the agent first: a real natural-language
    // request, parsed and routed by the orchestrator (same as "Tanya
    // Racik"), not a bare form POST. Its answer and tool trace render in
    // agentPanel below, so the planning step is visible, not skipped.
    let askData = null;
    try{
      const askRes = await fetch(API + "/api/ask", {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({question: buildAskSentence(body), lang: LANG})
      });
      if(askRes.ok) askData = await askRes.json();
    }catch(err){ /* the agent call is a bonus, never blocks the real solve below */ }

    // The agent resolved free text into exact solver parameters (province
    // matched, stage matched, budget parsed). Re-solve with those exact
    // params through /api/plan for the full rich payload the UI already
    // knows how to render — this keeps tool results small (per orchestrator
    // design) while the UI still gets recipes, images-worth of detail, etc.
    if(askData && askData.resolved_request){
      const r = askData.resolved_request;
      Object.assign(body, {
        days: r.days, stage: r.stage, portions: r.portions,
        province: r.province, island: r.island,
        budget_per_portion_idr: r.budget_per_portion_idr,
        ingredient_budget_share: r.ingredient_budget_share,
        exclude_terms: r.exclude_terms,
      });
    }

    const res = await fetch(API + "/api/plan", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify(body)
    });
    if(!res.ok) throw new Error((await res.json()).detail || res.statusText);
    PLAN = await res.json();
    ACTIVE_DAY = 0;
    DAY_REVIEW = {};
    el("setup").classList.add("hidden");
    el("result").classList.remove("hidden");
    renderAgentPanel(askData);
    renderPlan();
    window.scrollTo({top: 0, behavior: "smooth"});
    loadProcurement(body);
  }catch(err){
    alert(t("err.plan") + err.message);
  }finally{
    btn.disabled = false; btn.textContent = original;
    if(otherBtn) otherBtn.disabled = false;
    if(loading) loading.classList.add("hidden");
  }
}

  el("dayTabs").querySelectorAll(".tab").forEach(tab =>
    tab.onclick = () => { ACTIVE_DAY = +tab.dataset.i; renderPlan(); });

  renderDay(PLAN.days[ACTIVE_DAY]);
}

/** True when this dish is the reason a confirmed pantry item's bonus
 * existed for this day — the visible payoff for "will be prioritised next
 * week" that otherwise has no on-screen confirmation it did anything. */
function usesPantryStock(dish, dayIndex){
  const items = (LAST_BODY && LAST_BODY.pantry_items) || [];
  return items.some(it => it.tkpi_code === dish.main_food_code
    && dayIndex < (it.usable_within_days || 0));
}

/** Coarse, whole-day feedback — "is this day's menu ready to cook, or not" —
 * separate from the per-dish star widget above it (which is about whether
 * kids liked something they already ate). Both Accept and Reject write to
 * the feedback log (/api/rate/reason) so there's a real audit trail of
 * which days an operator actually reviewed and approved before serving —
 * the kind of record a government feeding program needs for compliance,
 * not just a UX nicety. Only Reject's "kids_disliked" reason also calls
 * /api/rate: an approval isn't a taste rating (the star widget already
 * covers that, after the fact), so Accept never touches dish rotation. */
let DAY_REVIEW = {};   // day.index -> {status, reason, saving, saved, failed}
const REJECT_REASONS = [
  ["too_expensive", "fb.tooExpensive"], ["not_regional", "fb.notRegional"],
  ["nutrition", "fb.nutrition"], ["kids_disliked", "fb.kidsDisliked"],
  ["other", "fb.other"],
];
const REJECT_RATING = 2;   // a representative "didn't work" value for the log/weighting
const ACCEPT_LOG_RATING = 3;   // neutral placeholder for the log schema — RATING_MULTIPLIER[3] is already "neutral" everywhere else in this codebase

function renderDayReview(day){
  const box = el("dayReview");
  const state = DAY_REVIEW[day.index] || {};
  const chips = REJECT_REASONS.map(([key, label]) =>
    `<button type="button" class="reason-chip${state.reason === key ? " picked" : ""}"
       data-reason="${key}">${esc(t(label))}</button>`).join("");
  const statusMsg = state.status === "accepted" ? t("review.acceptedNote")
    : state.status === "rejected" ? t("review.rejectedNote") : t("review.prompt");
  const saveMsg = state.status === "accepted"
    ? (state.saving ? "…" : state.failed ? t("review.failed")
       : state.saved ? t("review.acceptSaved") : "")
    : state.status !== "rejected" ? ""
    : !state.reason ? t("review.pickReason")
    : state.saving ? "…" : state.failed ? t("review.failed")
    : state.saved ? t(state.affectsRotation ? "review.saved" : "review.loggedOnly") : "";

  box.innerHTML = `
    <div class="review-row">
      <div>
        <div style="font-weight:700;font-size:14px">${esc(t("review.title"))}</div>
        <div style="font-size:12px;color:var(--ink-soft);margin-top:2px">${esc(statusMsg)}</div>
      </div>
      <div class="review-btns">
        <button type="button" class="review-btn accept${state.status === "accepted" ? " active" : ""}"
          id="reviewAccept" aria-label="${esc(t("review.accept"))}" title="${esc(t("review.accept"))}">✓</button>
        <button type="button" class="review-btn reject${state.status === "rejected" ? " active" : ""}"
          id="reviewReject" aria-label="${esc(t("review.reject"))}" title="${esc(t("review.reject"))}">✕</button>
      </div>
    </div>
    ${state.status === "rejected" ? `<div class="reason-chips">${chips}</div>
      <div class="hint" style="margin-top:8px">${esc(saveMsg)}</div>` : ""}
    ${state.status === "accepted" && saveMsg ? `<div class="hint" style="margin-top:8px">${esc(saveMsg)}</div>` : ""}`;

  el("reviewAccept").onclick = () => submitDayAccept(day);
  el("reviewReject").onclick = () => {
    DAY_REVIEW[day.index] = {...state, status: "rejected"};
    renderDayReview(day);
  };
  box.querySelectorAll(".reason-chip").forEach(chip =>
    chip.onclick = () => submitDayReject(day, chip.dataset.reason));
}

async function submitDayAccept(day){
  DAY_REVIEW[day.index] = {status: "accepted", saving: true};
  renderDayReview(day);
  const dishes = Object.values(day.slots).filter(Boolean);
  try{
    await Promise.all(dishes.map(dish => fetch(API + "/api/rate/reason", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({dish_id: dish.dish_id, rating: ACCEPT_LOG_RATING,
        province: LAST_BODY.province, stage: LAST_BODY.stage,
        dish_name: dish.name, reason: "accepted"})
    })));
    DAY_REVIEW[day.index] = {status: "accepted", saved: true};
  }catch(err){
    DAY_REVIEW[day.index] = {status: "accepted", failed: true};
  }
  renderDayReview(day);
}

// Only a taste complaint should push a dish out of rotation — "too
// expensive" or "not regional" is an objection to the plan, not to the
// dish itself, and silently lowering the dish's rating over it would
// devalue something the kids might genuinely like. Every reason still
// gets logged (the feedback record), but only this one also calls
// /api/rate to affect the next solve's recency weighting.
const REASONS_AFFECTING_ROTATION = new Set(["kids_disliked"]);

async function submitDayReject(day, reason){
  DAY_REVIEW[day.index] = {status: "rejected", reason, saving: true};
  renderDayReview(day);
  const dishes = Object.values(day.slots).filter(Boolean);
  const affectsRotation = REASONS_AFFECTING_ROTATION.has(reason);
  try{
    await Promise.all(dishes.map(dish => {
      const logReason = () => fetch(API + "/api/rate/reason", {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({dish_id: dish.dish_id, rating: REJECT_RATING,
          province: LAST_BODY.province, stage: LAST_BODY.stage,
          dish_name: dish.name, reason})
      });
      return affectsRotation
        ? fetch(API + "/api/rate", {
            method: "POST", headers: {"Content-Type": "application/json"},
            body: JSON.stringify({dish_id: dish.dish_id, rating: REJECT_RATING,
              province: LAST_BODY.province, stage: LAST_BODY.stage})
          }).then(logReason)
        : logReason();
    }));
    DAY_REVIEW[day.index] = {status: "rejected", reason, saved: true, affectsRotation};
  }catch(err){
    DAY_REVIEW[day.index] = {status: "rejected", reason, failed: true};
  }
  renderDayReview(day);
}

/** Ratings feed straight into the next solve's recency weighting
 * (history.py): a dish rated well eases back into rotation sooner than an
 * unrated one, a poorly-rated one is pushed away harder — not just "never
 * repeat," but "repeat what's actually liked." */
async function rateDish(dishId, n, row){
  row.querySelectorAll(".rate-star").forEach((s, i) =>
    s.style.color = i < n ? "var(--gold)" : "var(--line)");
  const result = row.querySelector(".rate-result");
  result.textContent = "…";
  try{
    const res = await fetch(API + "/api/rate", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        dish_id: dishId, rating: n,
        province: LAST_BODY.province, stage: LAST_BODY.stage
      })
    });
    if(!res.ok) throw new Error((await res.json()).detail || res.statusText);
    const d = await res.json();
    result.textContent = t("rate.saved", {avg: d.mean_rating});
  }catch(err){
    result.textContent = t("rate.failed");
  }
}

/** "Give me something else for this slot" — distinct from ingredient
 * substitution (availability, not preference) and from a full reshuffle
 * (redecides everything). /api/swap holds every other slot fixed and
 * recomputes just this one day's cost/nutrients/compliance around the
 * replacement, so PLAN.summary's plan-wide means and the relaxation table
 * are patched here too — otherwise the top metrics and the "batas
 * dilonggarkan" notes would keep showing pre-swap numbers for a day that
 * just changed underneath them. */
async function swapDish(dayIndex, slot, btn){
  const original = btn.textContent;
  btn.disabled = true;
  btn.innerHTML = `<span class="spinner" style="border-top-color:var(--ink);border-color:rgba(31,43,34,.25)"></span>`;
  try{
    const day = PLAN.days[dayIndex];
    const day_slots = {};
    for(const [s, d] of Object.entries(day.slots)) day_slots[s] = d ? d.dish_id : null;
    const res = await fetch(API + "/api/swap", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({...LAST_BODY, day_index: dayIndex, slot, day_slots})
    });
    if(!res.ok) throw new Error((await res.json()).detail || res.statusText);
    const updated = await res.json();
    PLAN.days[dayIndex] = {...day, ...updated};

    PLAN.summary.mean_cost_per_portion_idr =
      PLAN.days.reduce((s, d) => s + d.cost_per_portion_idr, 0) / PLAN.days.length;
    PLAN.summary.mean_adequacy =
      PLAN.days.reduce((s, d) => s + d.adequacy, 0) / PLAN.days.length;
    const freshShortfalls = updated.compliance
      .filter(r => r.binding && r.pct < 100)
      .map(r => ({day: dayIndex, label_id: r.label_id, label_en: r.label_en,
        unit: r.unit, shortfall: Math.max(0, r.target - r.value),
        target: r.target, share: Math.max(0, (100 - r.pct) / 100)}));
    PLAN.relaxations = PLAN.relaxations.filter(r => r.day !== dayIndex)
      .concat(freshShortfalls).sort((a, b) => b.share - a.share);
    PLAN.summary.relaxed_floors = PLAN.relaxations.length;

    renderPlan();
  }catch(err){
    alert(t("swap.failed", {error: err.message}));
    btn.disabled = false; btn.textContent = original;
  }
}

/** Calls the Substitution Reviewer agent — a separate, differently-prompted
 * agent from the Planner (see substitution.py): not a re-optimisation, a
 * judgment call over one ingredient in an already-chosen dish. */
async function reviewSubstitute(ingredient, btn){
  const out = el("subResult");
  const original = btn.textContent;
  btn.disabled = true; btn.textContent = "…";
  out.innerHTML = `<div class="empty" style="padding:14px">${esc(t("sub.calling"))}</div>`;
  try{
    const res = await fetch(API + "/api/substitute", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({dish_id: CURRENT_DISH_ID, ingredient, lang: LANG,
        province: LAST_BODY.province, stage: LAST_BODY.stage})
    });
    if(!res.ok) throw new Error((await res.json()).detail || res.statusText);
    const r = await res.json();
    const badge = r.is_core
      ? `<span class="qbadge medium">${esc(t("sub.core"))}</span>`
      : `<span class="qbadge high">${esc(t("sub.flexible"))}</span>`;
    const sourceTag = r.source === "sealion"
      ? `<span class="qbadge high" style="margin-left:6px">${esc(t("sub.fromModel"))}</span>`
      : `<span class="qbadge medium" style="margin-left:6px">${esc(t("sub.fromRules"))}</span>`;
    const subLine = r.action === "substitute" && r.substitute
      ? `<div style="margin-top:8px;font-size:13.5px">
           <strong>${esc(t("sub.useInstead"))}:</strong> ${esc(r.substitute.name)}
           <span class="mono" style="color:var(--ink-soft);font-size:11.5px">
             (${r.substitute.energy_kcal} ${esc(t("u.kcal"))}, ${r.substitute.protein_g}${esc(t("u.g"))} protein)</span>
         </div>` : "";
    out.innerHTML = `<div class="notice" style="margin-top:12px">
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px">${badge}${sourceTag}</div>
      <div style="font-size:13.5px">${esc(r.reason)}</div>${subLine}</div>`;
  }catch(err){
    out.innerHTML = `<div class="notice" style="margin-top:12px">${esc(t("ask.failed", {error: err.message}))}</div>`;
  }finally{
    btn.disabled = false; btn.textContent = original;
  }
}

    const key = row.dataset.for;
    const toggleBtn = el("procurement").querySelector(`.leftover-toggle[data-key="${CSS.escape(key)}"]`);
    row.querySelector(".leftover-save").onclick = () =>
      saveLeftover(key, toggleBtn.dataset.name,
        row.querySelector(".leftover-kg"), row.querySelector(".leftover-days"),
        row.querySelector(".leftover-result"), row, toggleBtn);
  });
}

/** Reported leftovers feed optimizer.py's pantry bonus (the mirror image
 * of the recency penalty): using this stock up gets nudged for the days
 * it's still marked good for, scoped by province+stage same as ratings.
 * On success the row collapses and the toggle marks itself done — before
 * this it stayed open and editable with no visible "recorded" state, so
 * a second click on Simpan looked indistinguishable from the first. */
async function saveLeftover(tkpiCode, name, kgInput, daysInput, result, row, toggleBtn){
  const kg = parseFloat(kgInput.value);
  if(!Number.isFinite(kg) || kg < 0){ result.textContent = t("proc.leftoverInvalid"); return; }
  result.textContent = "…";
  try{
    const res = await fetch(API + "/api/pantry/report", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        province: LAST_BODY.province, stage: LAST_BODY.stage,
        tkpi_code: tkpiCode, ingredient_name: name,
        remaining_g: kg * 1000, usable_within_days: +daysInput.value || null
      })
    });
    if(!res.ok) throw new Error((await res.json()).detail || res.statusText);
    result.textContent = t("proc.leftoverSaved");
    if(toggleBtn){
      toggleBtn.textContent = "✓ " + t("proc.leftoverSaved").split(" ")[0];
      toggleBtn.disabled = true;
    }
    setTimeout(() => { if(row) row.classList.add("hidden"); }, 900);
  }catch(err){
    result.textContent = t("rate.failed");
  }
}

function downloadCsv(){
  if(!PROC) return;
  const rows = [[t("csv.name"),t("csv.weight"),t("csv.cost"),t("csv.matched"),t("csv.used")]]
    .concat(PROC.lines.map(l => [l.name, l.gross_kg.toFixed(3), Math.round(l.cost_idr),
      l.matched ? t("csv.yes") : t("csv.no"), l.used_in.join("; ")]));
  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
  const url = URL.createObjectURL(new Blob(["﻿" + csv], {type:"text/csv;charset=utf-8"}));
  const a = document.createElement("a");
  a.href = url;
  a.download = t("csv.file", {days: PROC.days, portions: PROC.portions});
  a.click(); URL.revokeObjectURL(url);
}

/* ---------------- ask (SEA-LION orchestrator) ---------------- */
function paintOrchBadge(s){
  const b = el("orchBadge");
  // The model name itself, not a hardcoded provider label — this badge
  // previously always said "SEA-LION active" regardless of which model
  // was actually configured (Bedrock, a gateway, anything).
  b.textContent = s.mode === "sealion" ? s.model.split("/").pop() : t("orch.basic");
  b.title = s.mode === "sealion" ? `${s.provider || s.model} — ${s.note}` : t("orch.basicTitle");
  if(s.mode === "sealion"){
    b.style.background = "#E4EFE7"; b.style.color = "var(--leaf-dark)";
    b.style.borderColor = "var(--leaf)";
  }
}

async function loadOrchestratorStatus(){
  try{
    ORCH = await (await fetch(API + "/api/orchestrator")).json();
    paintOrchBadge(ORCH);
  }catch(err){ el("orchBadge").textContent = t("orch.unavailable"); }
}

async function ask(){
  const q = el("askBox").value.trim();
  if(!q) return;
  const btn = el("askBtn"), out = el("askOut");
  btn.disabled = true;
  btn.innerHTML = `<span class="spinner"></span>${esc(t("btn.asking"))}`;
  out.classList.remove("hidden");
  out.innerHTML = `<div class="empty" style="padding:18px">${esc(t("ask.calling"))}</div>`;
  try{
    const res = await fetch(API + "/api/ask", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({question: q, lang: LANG})
    });
    if(!res.ok) throw new Error((await res.json()).detail || res.statusText);
    renderAnswer(await res.json());
  }catch(err){
    out.innerHTML = `<div class="notice">${esc(t("ask.failed", {error: err.message}))}</div>`;
  }finally{
    btn.disabled = false; btn.textContent = t("btn.ask");
  }
}

/** propose_recipe's tool result carries both the computed draft (real
 * numbers, from the same pipeline any corpus recipe runs through) and the
 * exact ingredient_lines/steps text the model wrote — the latter is what
 * /api/recipe/save actually persists, so it has to be echoed back verbatim
 * rather than re-derived from the rendered numbers. */
function findRecipeDraft(trace){
  const entry = (trace || []).find(x => x.tool === "propose_recipe" && x.result && x.result.draft);
  return entry ? entry.result : null;
}

/** The model may or may not have said which stage/province this draft is
 * for (propose_recipe's suggested_scope) — the setup form's current
 * selection is a reasonable fallback, but silently saving under whatever
 * the form happens to show right now (rather than what the user actually
 * asked for) is exactly how a saved recipe ends up in the wrong scope and
 * never gets considered for the menu it was meant for. So the scope is
 * always shown and editable here, defaulted from whichever is known. */
function renderRecipeDraftCard(draftResult){
  const d = draftResult.draft;
  const scope = draftResult.suggested_scope || {};
  const stageOptions = (META.stages || []).map(s =>
    `<option value="${esc(s.key)}"${s.key === (scope.stage || el("stage").value) ? " selected" : ""}>${esc(s.label)}</option>`).join("");
  const provinceValue = scope.province || el("province").value || "";
  const provinceOptions = `<option value=""${provinceValue ? "" : " selected"}>${esc(t("opt.noProvince"))}</option>` +
    (META.provinces || []).map(p =>
      `<option value="${esc(p.province)}"${p.province === provinceValue ? " selected" : ""}>${esc(p.province)}</option>`).join("");
  const rows = (draftResult.ingredients || []).map(i => `<tr class="${i.matched ? "" : "dim"}">
    <td>${esc(i.raw)}${i.tkpi_name ? `<div style="font-size:11px;color:var(--ink-soft)">${esc(i.tkpi_name)}</div>` : ""}</td>
    <td class="num">${i.gross_g.toFixed(0)} g</td>
    <td class="num">${rp(i.cost_idr)}</td>
  </tr>`).join("");
  return `
    <div class="card pad" style="margin-top:14px;border-color:var(--gold)">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">
        <div>
          <div style="font-size:11px;font-weight:700;color:var(--warn);text-transform:uppercase;letter-spacing:.05em">
            ${esc(t("recipe.draftBadge"))}</div>
          <h3 style="font-size:17px;margin-top:3px">${esc(d.name)}</h3>
        </div>
        <span class="qbadge medium">${esc(slotLabel(d.slot))}</span>
      </div>
      <div class="metrics" style="margin:12px 0">
        <div class="metric"><div class="k">${esc(t("dish.energy"))}</div>
          <div class="v">${Math.round(d.per_portion.energy_kcal)}</div><div class="s">${esc(t("dish.kcalPer"))}</div></div>
        <div class="metric"><div class="k">${esc(t("dish.protein"))}</div>
          <div class="v">${d.per_portion.protein_g.toFixed(1)}</div><div class="s">${esc(t("dish.gPer"))}</div></div>
        <div class="metric"><div class="k">${esc(t("dish.cost"))}</div>
          <div class="v" style="font-size:19px">${rp(d.cost_per_portion_idr)}</div><div class="s">${esc(t("dish.costPer"))}</div></div>
      </div>
      <div class="scroll"><table><tbody>${rows}</tbody></table></div>
      <p class="hint" style="margin-top:10px">${esc(t("recipe.reviewHint"))}</p>
      <div class="grid2" style="margin-top:12px">
        <div>
          <label class="fld" for="draftStage">${esc(t("recipe.saveStage"))}</label>
          <select id="draftStage">${stageOptions}</select>
        </div>
        <div>
          <label class="fld" for="draftProvince">${esc(t("recipe.saveProvince"))}</label>
          <select id="draftProvince">${provinceOptions}</select>
        </div>
      </div>
      <div style="display:flex;gap:8px;margin-top:10px;align-items:center">
        <button type="button" class="btn" id="recipeSaveBtn">${esc(t("recipe.save"))}</button>
        <span class="mono" id="recipeSaveMsg" style="font-size:12px;color:var(--ink-soft)"></span>
      </div>
    </div>`;
}

function wireRecipeSave(draftResult){
  const btn = el("recipeSaveBtn");
  if(!btn) return;
  btn.onclick = async () => {
    const msg = el("recipeSaveMsg");
    btn.disabled = true; msg.textContent = t("recipe.saving");
    try{
      const res = await fetch(API + "/api/recipe/save", {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          province: el("draftProvince").value, stage: el("draftStage").value,
          name: draftResult.draft.name,
          ingredient_lines: draftResult.ingredient_lines || [],
          steps: draftResult.steps || "",
        })
      });
      if(!res.ok) throw new Error((await res.json()).detail || res.statusText);
      msg.textContent = t("recipe.saved");
      loadRecipes();
    }catch(err){
      msg.textContent = t("recipe.saveFailed");
      btn.disabled = false;
    }
  };
}

function renderAnswer(d){
  const modeTag = d.mode === "sealion"
    ? `<span class="qbadge high">${esc(d.model.split("/").pop())}</span>`
    : `<span class="qbadge medium"${d.fallback_reason ? ` title="${esc(d.fallback_reason)}"` : ""}>${esc(t("orch.basic"))}</span>`;
  const tools = d.trace.length
    ? `<details style="margin-top:12px">
         <summary style="cursor:pointer;font-size:12.5px;color:var(--ink-soft);font-weight:600">
           ${esc(t("ask.trace", {n: d.trace.length}))}</summary>
         <div style="margin-top:8px">${d.trace.map(x => `
           <div style="border-left:2.5px solid var(--line);padding:5px 0 5px 10px;margin-bottom:7px">
             <div class="mono" style="font-size:11.5px;font-weight:700">${esc(x.tool)}
               <span style="font-weight:400;color:var(--ink-soft)">${x.seconds}s</span></div>
             <div class="mono" style="font-size:10.5px;color:var(--ink-soft);word-break:break-all">
               ${esc(JSON.stringify(x.arguments))}</div>
           </div>`).join("")}</div>
       </details>` : "";

  // In fallback mode the answer text already *is* the rendered plan, so the
  // structured block would just repeat it.
  const plan = (d.mode === "sealion" && d.plan && d.plan.days) ? `
    <div style="margin-top:12px;border-top:1px dashed var(--line);padding-top:11px">
      <div style="font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:7px">
        ${esc(t("ask.planned"))}</div>
      ${d.plan.days.map(day => `
        <div style="font-size:12px;padding:5px 0;border-bottom:1px solid var(--paper-dim)">
          <span class="mono" style="font-weight:700">${LANG === "id" ? "H" : "D"}${day.day}</span>
          <span class="mono" style="color:var(--ink-soft)"> ${rp(day.cost_per_portion_idr)}
            · ${day.energy_kcal} ${esc(t("u.kcal"))} · AKG ${Math.round(day.adequacy*100)}%</span>
          <div style="color:var(--ink-soft);margin-top:2px">
            ${esc(Object.values(day.dishes).filter(Boolean).join(" · "))}</div>
        </div>`).join("")}
    </div>` : "";

  const draft = findRecipeDraft(d.trace);
  const draftCard = draft ? renderRecipeDraftCard(draft) : "";

  el("askOut").innerHTML = `
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">${modeTag}
      <span style="font-size:11.5px;color:var(--ink-soft)">${esc(t("ask.steps", {n: d.steps, reason: friendlyReason(d.stopped_because)}))}</span></div>
    <div style="font-size:13.5px;line-height:1.65;white-space:pre-wrap">${esc(d.answer)}</div>
    ${plan}${draftCard}${tools}`;
  if(draft) wireRecipeSave(draft);
}

/* ---------------- wiring ---------------- */
document.querySelectorAll(".lang button").forEach(b =>
  b.onclick = () => setLang(b.dataset.lang));
el("askBtn").onclick = ask;
el("askExample").onclick = () => {
  const list = EXAMPLES[LANG] || EXAMPLES.id;
  el("askBox").value = list[Math.floor(Math.random() * list.length)];
};
el("askBox").addEventListener("keydown", e => {
  if((e.metaKey || e.ctrlKey) && e.key === "Enter") ask();
});
el("resultNav").querySelectorAll(".result-nav-btn").forEach(btn =>
  btn.onclick = () => {
    el("resultNav").querySelectorAll(".result-nav-btn").forEach(b => {
      b.classList.toggle("active", b === btn);
      b.setAttribute("aria-selected", String(b === btn));
    });
    el("viewPlan").classList.toggle("hidden", btn.dataset.view !== "plan");
    el("viewProcurement").classList.toggle("hidden", btn.dataset.view !== "procurement");
  });
el("go").onclick = () => generate(undefined, el("go"));
el("reshuffleBtn").onclick = () => generate(Math.floor(Math.random() * 100000), el("reshuffleBtn"));
el("backBtn").onclick = () => {
  el("result").classList.add("hidden");
  el("setup").classList.remove("hidden");
  window.scrollTo({top: 0, behavior: "smooth"});
};
el("csvBtn").onclick = downloadCsv;
el("reportBtn").onclick = async () => {
  const btn = el("reportBtn"), label = btn.textContent;
  btn.disabled = true; btn.textContent = t("report.building");
  try{
    const res = await fetch(API + "/api/report", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({...LAST_BODY, lang: LANG})
    });
    if(!res.ok) throw new Error(res.statusText);
    // Open in a tab so the operator can print straight to PDF; if the popup is
    // blocked, fall back to downloading the same file.
    const url = URL.createObjectURL(new Blob([await res.text()], {type:"text/html"}));
    const win = window.open(url, "_blank");
    if(!win){
      const a = document.createElement("a");
      a.href = url; a.download = `racik-laporan-${LAST_BODY.days}h.html`; a.click();
    }
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }catch(err){
    alert(t("ask.failed", {error: err.message}));
  }finally{
    btn.disabled = false; btn.textContent = label;
  }
};
el("dlgClose").onclick = () => el("dlg").close();
el("dlg").onclick = e => { if(e.target === el("dlg")) el("dlg").close(); };

boot().catch(err => {
  el("corpusBadge").textContent = t("err.corpus");
  alert(t("err.boot", {error: err.message}));
});
</script>
